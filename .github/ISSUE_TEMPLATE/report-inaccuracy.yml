name: Report an inaccuracy
description: General accuracy report that doesn't fit "contest a verdict" (wrong metadata, broken link, stale evidence, missing logo, etc)
title: "[inaccuracy] <short description>"
labels: ["accuracy"]
body:
  - type: markdown
    attributes:
      value: |
        Use this for anything that's wrong on the site that isn't a specific (product, story)
        verdict tier/quality dispute — for that, use "Contest a verdict" instead.
  - type: input
    id: location
    attributes:
      label: Where
      description: Category/product (and story id if relevant), or the page URL
      placeholder: ai-coding / claude-code
    validations:
      required: true
  - type: textarea
    id: whats-wrong
    attributes:
      label: What's wrong
      description: Describe the inaccuracy — stale data, broken link, wrong metadata, missing logo, etc.
    validations:
      required: true
  - type: textarea
    id: evidence-urls
    attributes:
      label: Evidence / source URLs
      description: Link(s) that support the correction, if applicable
    validations:
      required: false
  - type: textarea
    id: suggested-fix
    attributes:
      label: Suggested fix
      description: What should it say/show instead?
    validations:
      required: false
