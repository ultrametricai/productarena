name = "productarena-proxy"
main = "worker.js"
compatibility_date = "2026-09-01"

routes = [
  { pattern = "ultrametric.ai/productarena*", zone_name = "ultrametric.ai" }
]

# Compare-popularity counters (pair keys only — no IPs/UAs; see worker.js "Compare popularity
# counter"). Operator setup, one-time, before deploying this config:
#   wrangler kv namespace create PA_COMPARE_STATS
# then paste the returned id below and `wrangler deploy`. Until then the worker degrades
# honestly: counting no-ops and /api/popular-compares returns 503 (the client renders nothing).
[[kv_namespaces]]
binding = "PA_COMPARE_STATS"
id = "ed14fd00ad8a4fe5a0a82f4eff4d55f3"

# Auth backend (/productarena/auth/* — WorkOS AuthKit; see worker.js "Auth backend" and
# docs/AUTH.md). Operator setup, one-time:
#   1. Paste the WorkOS client ID (dashboard → the UM environment → API keys) below.
#   2. wrangler secret put WORKOS_API_KEY    # the sk_… API key from the same page
#   3. wrangler secret put PA_SESSION_KEY    # cookie-signing key: `openssl rand -base64 48`
# Until all three are set, /auth/* fails closed with an explicit "auth not configured" 500 and
# the site itself is unaffected (the client session hook degrades to anonymous).
[vars]
WORKOS_CLIENT_ID = "" # placeholder — client_… from the WorkOS dashboard
# Try-it sandbox-tier credentials (worker.js "BYO-key / sandbox credentials" section): optional
# per-product demo credentials stored as wrangler secrets named DEMO_CRED_<PRODUCTID>
# (uppercased, dashes -> underscores; e.g. `wrangler secret put DEMO_CRED_STRIPE` with a Stripe
# TEST-MODE key). Provisioning checklist and safety rules: docs/TRY-IT-DEMO-ACCOUNTS.md.
# No secret provisioned -> the "use our sandbox account" option simply never appears.
